name: iOS Build

on:
    push:
        branches:
            - main

jobs:
    build:
        runs-on: macos-latest
        
        steps:
            - uses: actions/checkout@v3
          
            - name: Setup Ruby
              uses: ruby/setup-ruby@v1
              with:
                ruby-version: '3.2'
                
              
            - name: Install Fastlane
              run: gem install fastlane
             
            - name: Build iOS App
              run: fastlane build
              
